<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devnotes</title>
    <link rel="stylesheet" href="Estilos/main.css">
    <script src="JS/script.js"></script>
    <script src="https://kit.fontawesome.com/8125016427.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>DevNotes</h1>
        <div id="inputBuscaCamp">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" name="busca" id="ibusca">
        </div>
        <button>Exportar CSV</button>
    </header>

    <main>
        <div id="criarNotaCamp">
            <i class="fa-solid fa-plus"></i>
            <input type="text" name="criarNota" id="icriarNota">
        </div>
        <div id="campoNotas">
            <div class="nota">
                <textarea name="notaText" id="inotaText"></textarea>
                <i class="fa-solid fa-thumbtack"></i>
                <i class="fa-solid fa-thumbtack-slash"></i>
                <i class="fa-solid fa-copy"></i>
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>
    </main>


    
</body>
</html>
