<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devnotes</title>
    <link rel="stylesheet" href="Estilos/main.css">
    <script src="JS/script.js"></script>
    <script src="https://kit.fontawesome.com/8125016427.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>DevNotes</h1>
        <div id="inputBuscaCamp">
            <label for="ibusca"><i class="fa-solid fa-magnifying-glass iconSearch"></i></label>
            <input type="text" name="busca" id="ibusca" placeholder="Procure por uma nota aqui">
        </div>
        <button id="exportarBTN">Exportar CSV <i class="fa-solid fa-download"></i></button>
    </header>

    <main>
        <div id="criarNotaCamp">
            <input type="text" name="criarNota" id="icriarNota">
            <i class="fa-solid fa-plus iconPlus"></i>
        </div>
        <div id="campoNotas">
            <div class="nota">
                <textarea name="notaText" id="inotaText"></textarea>
                <i class="fa-solid fa-thumbtack"></i>
                <i class="fa-solid fa-thumbtack-slash"></i>
                <i class="fa-solid fa-copy iconesNotes"></i>
                <i class="fa-solid fa-xmark iconesNotes"></i>
            </div>
        </div>
    </main>


    
</body>
</html>
